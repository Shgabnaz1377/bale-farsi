name: Native apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android ${{ matrix.app.name }} (debug APK)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - { id: persianmeow, name: PersianMeow, build: build, project: android }
          - { id: begociao, name: Bego Ciao, build: 'build:bego', project: native/begociao/android }
    env:
      APP: ${{ matrix.app.id }}
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - name: Build the web app
        run: npm run ${{ matrix.app.build }}
      - run: npx cap sync android
      - name: Build APK
        working-directory: ${{ matrix.app.project }}
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.id }}-android-debug-apk
          path: ${{ matrix.app.project }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  ios:
    name: iOS ${{ matrix.app.name }} (simulator build, unsigned)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - { id: persianmeow, name: PersianMeow, build: build, project: ios/App }
          - { id: begociao, name: Bego Ciao, build: 'build:bego', project: native/begociao/ios/App }
    env:
      APP: ${{ matrix.app.id }}
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the web app
        run: npm run ${{ matrix.app.build }}
      - run: npx cap sync ios
      - name: Build for the iOS simulator
        run: |
          xcodebuild -project ${{ matrix.app.project }}/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
