name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: content · lint · typecheck · test · e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Content rules (PersianMeow, its Italian translation, and Bego Ciao)
        run: npm run check:content && npm run check:italian && npm run check:bego
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests, PersianMeow
        run: npm test
      - name: Unit tests, Bego Ciao
        run: npm run test:bego
      - name: Build both apps
        run: npm run build && npm run build:bego
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests (console must stay clean)
        run: npx playwright test
